<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP & Partners — Timesheet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f2a44'/%3E%3Ctext x='32' y='42' font-family='Helvetica' font-size='24' font-weight='700' text-anchor='middle' fill='%23b08d57'%3EA%26P%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:  #1c2e42;
      --gold:  #b08d57;
      --border: #e2dbd0;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #f5f2ee;
    }

    /* ── PAGE SHELL ── */
    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    /* ── CARD ── */
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow:
        0 1px 2px rgba(28,46,66,.04),
        0 4px 16px rgba(28,46,66,.08),
        0 24px 48px rgba(28,46,66,.06);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }

    /* Top gold bar */
    .card-bar {
      height: 3px;
      background: linear-gradient(90deg, #8a6a3a, var(--gold), #c8a96e, var(--gold), #8a6a3a);
    }

    .card-body {
      padding: 44px 44px 40px;
    }

    /* ── BRAND ── */
    .brand-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 36px;
    }
    .brand-logo {
      height: 80px;
      width: auto;
      max-width: 200px;
      object-fit: contain;
      margin-bottom: 16px;
    }
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--navy);
      letter-spacing: .3px;
      margin-bottom: 4px;
    }
    .brand-sub {
      font-size: 9.5px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider-text {
      font-size: 10px;
      color: #a09080;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      white-space: nowrap;
    }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #8a9aaa;
      margin-bottom: 7px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 15px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      background: #fafaf8;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      color: var(--navy);
      outline: none;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .form-group input:hover:not(:focus) { border-color: #c8b090; }
    .form-group input:focus {
      background: #fff;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(176,141,87,.10);
    }
    .form-group input::placeholder { color: #bbb5ac; }

    /* Alert */
    .alert {
      padding: 12px 14px;
      border-radius: 7px;
      font-size: 13px;
      margin-bottom: 18px;
      border-left: 4px solid #c0392b;
      background: #fdf2f2;
      color: #8b1a1a;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.45;
      font-weight: 500;
      animation: alertFadeIn .25s ease-out;
    }
    .alert::before {
      content: '⚠';
      flex: 0 0 auto;
      font-weight: 700;
      font-size: 15px;
      line-height: 1;
      margin-top: 1px;
    }
    .alert.hidden { display: none; }
    @keyframes alertFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Error state on inputs — pairs with the alert above */
    .form-group input.error {
      border-color: #c0392b !important;
      background: #fdf2f2 !important;
      box-shadow: 0 0 0 3px rgba(192,57,43,.10);
    }

    /* Shake the card briefly on a failed login so the error is unmissable */
    .card.shake { animation: cardShake .42s cubic-bezier(.36,.07,.19,.97); }
    @keyframes cardShake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }

    /* Button */
    .btn-submit {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: background .15s, transform .12s, box-shadow .15s;
      box-shadow: 0 2px 8px rgba(28,46,66,.20);
    }
    .btn-submit:hover:not(:disabled) {
      background: #243447;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(28,46,66,.28);
    }
    .btn-submit:active { transform: none; }
    .btn-submit:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    /* ── FOOTER ── */
    .card-footer {
      padding: 14px 44px 18px;
      border-top: 1px solid #f0ece6;
      display: flex;
      justify-content: center;
    }
    .card-footer a {
      font-size: 11px;
      color: #a09080;
      text-decoration: none;
      letter-spacing: .3px;
      transition: color .12s;
    }
    .card-footer a:hover { color: var(--gold); }

    /* ── PAGE FOOTER ── */
    .page-footer {
      margin-top: 24px;
      font-size: 10.5px;
      color: #b0a898;
      text-align: center;
      letter-spacing: .3px;
    }

    @media (max-width: 480px) {
      .card-body { padding: 36px 28px 32px; }
      .card-footer { padding: 14px 28px 18px; }
    }
  </style>
</head>
<body>
  <div class="shell">

    <div class="card">
      <div class="card-bar"></div>
      <div class="card-body">

        <!-- Brand -->
        <div class="brand-block">
          <img class="brand-logo" src="/img/logo.png" alt="AP & Partners"
               onerror="this.style.display='none'">
          <div class="brand-name">AP &amp; Partners</div>
          <div class="brand-sub">Advocates</div>
        </div>

        <!-- Divider -->
        <div class="divider">
          <div class="divider-line"></div>
          <div class="divider-text">Sign in to continue</div>
          <div class="divider-line"></div>
        </div>

        <!-- Alert -->
        <div id="alert" class="alert hidden"></div>

        <!-- Form -->
        <form id="login-form" autocomplete="on">
          <div class="form-group">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" required
                   autocomplete="username" placeholder="you@appartners.in">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required
                   autocomplete="current-password" placeholder="••••••••">
          </div>

          <!-- 2FA step (hidden initially, shown when server says need_2fa) -->
          <div class="form-group" id="totp-group" style="display:none;">
            <label for="totp-code">🔐 6-digit code from authenticator app</label>
            <input id="totp-code" name="totp-code" type="text" maxlength="9"
                   autocomplete="one-time-code" placeholder="123 456"
                   style="font-size:22px;letter-spacing:8px;text-align:center;font-family:monospace;">
            <div style="font-size:11px;color:#a09080;margin-top:6px;">
              Don't have your phone? Use a <strong>backup code</strong> instead.
              <a href="#" onclick="resetToPasswordStep(event)" style="color:var(--gold);text-decoration:underline;">← Back to password</a>
            </div>
          </div>

          <button class="btn-submit" type="submit" id="login-btn">Sign in</button>
        </form>

      </div>

      <div class="card-footer">
        <a href="https://www.appartners.in" target="_blank">www.appartners.in</a>
      </div>
    </div>

    <div class="page-footer">Timesheet &amp; Billing &nbsp;·&nbsp; Internal Use Only</div>

  </div>

  <script src="/js/common.js"></script>
  <script>
    (function () {
      const u = Auth.user();
      if (Auth.token() && u) {
        // Admin panel roles include legacy 'admin'/'billing' plus the newer
        // RBAC codes super_admin/hr/partner_view/accounts.
        const code = u.role_code || u.role;
        const ADMIN_ROLES = ['admin','billing','super_admin','hr','partner_view','accounts'];
        location.href = ADMIN_ROLES.includes(code) ? '/admin' : '/associate';
      }
    })();

    const ADMIN_PANEL_ROLES = ['admin', 'billing', 'super_admin', 'hr', 'partner_view', 'accounts'];

    // Custom alert shower for login — overrides the 5-second auto-hide from
    // common.js so the user has time to read & retry. Also handles shake +
    // input red highlight + auto-focus to password field for fast retry.
    function showLoginError(msg) {
      const el = document.getElementById('alert');
      el.classList.remove('hidden');
      el.textContent = msg;
      // Add red border on both inputs so it's obvious which fields to retry.
      document.getElementById('email').classList.add('error');
      document.getElementById('password').classList.add('error');
      // Shake the card so the failure is unmissable.
      const card = document.querySelector('.card');
      card.classList.remove('shake');
      // Force a reflow so the animation re-runs even if the same class was just removed.
      void card.offsetWidth;
      card.classList.add('shake');
      // Clear the password and focus it for a quick retry — most common case
      // is a typo, not a wrong email.
      const pw = document.getElementById('password');
      pw.value = '';
      pw.focus();
    }

    function clearLoginError() {
      const el = document.getElementById('alert');
      el.classList.add('hidden');
      el.textContent = '';
      document.getElementById('email').classList.remove('error');
      document.getElementById('password').classList.remove('error');
    }

    // Clear the red error styling the moment the user starts editing either
    // field — keeps the form feeling responsive after a failed attempt.
    document.getElementById('email').addEventListener('input', clearLoginError);
    document.getElementById('password').addEventListener('input', clearLoginError);

    // 2FA state — captured between password step and code step
    let pendingEmail = '', pendingPassword = '';

    function show2FAStep() {
      // Hide email/password rows, show TOTP input
      document.getElementById('email').parentElement.style.display = 'none';
      document.getElementById('password').parentElement.style.display = 'none';
      document.getElementById('totp-group').style.display = '';
      document.getElementById('login-btn').textContent = 'Verify & Sign in';
      setTimeout(() => document.getElementById('totp-code').focus(), 50);
    }

    function resetToPasswordStep(ev) {
      if (ev) ev.preventDefault();
      document.getElementById('email').parentElement.style.display = '';
      document.getElementById('password').parentElement.style.display = '';
      document.getElementById('totp-group').style.display = 'none';
      document.getElementById('totp-code').value = '';
      document.getElementById('password').value = '';
      pendingEmail = ''; pendingPassword = '';
      document.getElementById('login-btn').textContent = 'Sign in';
      clearLoginError();
    }
    window.resetToPasswordStep = resetToPasswordStep;

    async function submitWithTOTP(code) {
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Verifying…';
      try {
        const res = await api('/api/auth/login', {
          method: 'POST',
          body: { email: pendingEmail, password: pendingPassword, totp_code: code }
        });
        Auth.setSession(res.token, res.user);
        location.href = ADMIN_PANEL_ROLES.includes(res.user.role) ? '/admin' : '/associate';
      } catch (err) {
        showLoginError((err && err.message) || 'Invalid 2FA code');
        document.getElementById('totp-code').value = '';
        document.getElementById('totp-code').focus();
      } finally {
        btn.disabled = false; btn.textContent = 'Verify & Sign in';
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearLoginError();
      // If we're in the 2FA "enter code" phase, submit code instead
      const codeInput = document.getElementById('totp-code');
      if (codeInput && codeInput.value) {
        return submitWithTOTP(codeInput.value);
      }
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const res = await api('/api/auth/login', { method: 'POST', body: { email, password } });
        if (res.need_2fa) {
          // Show TOTP input — keep email/password staged for second submit
          pendingEmail = email; pendingPassword = password;
          show2FAStep();
          return;
        }
        Auth.setSession(res.token, res.user);
        location.href = ADMIN_PANEL_ROLES.includes(res.user.role) ? '/admin' : '/associate';
      } catch (err) {
        // The backend already returns "Invalid credentials" (with optional
        // attempts-remaining or lockout suffix) without revealing whether
        // the email exists. We pass that through verbatim because the lockout
        // duration is genuinely useful info. For everything else (network
        // errors, etc.), show a generic friendly message.
        const raw = (err && err.message) || '';
        const friendly = /invalid credentials/i.test(raw)
          ? raw.replace(/^invalid credentials/i, 'Email or password is incorrect')
          : /locked/i.test(raw)
            ? raw
            : raw || 'Could not sign in. Please check your connection and try again.';
        showLoginError(friendly);
      } finally {
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
